name: CI

# Every push and pull request: typecheck and the full test suite must pass.
# Lint is advisory (reported, never blocking) until formatting is fixed.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: npx tsc --noEmit -p .
      - name: Tests
        run: bun run test
      - name: Lint (advisory)
        continue-on-error: true
        run: bun run lint
