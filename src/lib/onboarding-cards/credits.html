<!doctype html><html><head><meta charset="utf-8"><title>credits</title></head>
<body style="margin:0;width:1080px;height:1350px;overflow:hidden;background:oklch(0.18 0.02 255)">
<!-- Render at 1080x1350. Fonts: Plus Jakarta Sans 400-800, Caveat 600 (load TTFs into the renderer). Placeholders in {{ }} are filled server-side. -->
<div style="transform:scale(2);transform-origin:top left;width:540px;height:675px;">

  
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
    a { color: #31b57f; } a:hover { color: #6dd2a8; }
  </style>

<div style="width: 540px; height: 675px; background: oklch(0.18 0.02 255); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 48px;">
  <div style="position: absolute; inset: 0; background: radial-gradient(70% 50% at 50% 50%, oklch(0.35 0.08 162 / 0.5), transparent 70%);"></div>
  <div style="position: absolute; top: 40px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 13px; font-weight: 800; color: oklch(0.985 0.003 250);">AiDwar</div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #31b57f;">Welcome credits</div>
  </div>
  <div style="position: relative; width: 400px; background: oklch(0.985 0.003 250); border-radius: 18px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); display: flex; flex-direction: column; overflow: hidden;">
    <div style="padding: 28px 32px 22px; display: flex; flex-direction: column; gap: 6px; background: #31b57f;">
      <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.985 0.003 250); opacity: 0.85;">Added to {{business_name}}</div>
      <div style="display: flex; align-items: baseline; gap: 8px;">
        <div style="font-size: 56px; font-weight: 800; letter-spacing: -0.03em; color: oklch(0.995 0 0); line-height: 1;">₹100</div>
        <div style="font-size: 16px; font-weight: 600; color: oklch(0.995 0 0); opacity: 0.9;">credits</div>
      </div>
      <div style="font-size: 14px; font-weight: 600; color: oklch(0.995 0 0); opacity: 0.9;">≈ 700 customer messages, on the house</div>
    </div>
    <div style="padding: 22px 32px 26px; display: flex; flex-direction: column; gap: 12px;">
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <div style="font-weight: 500; color: oklch(0.55 0.02 255);">Earned by</div>
        <div style="font-weight: 700; color: oklch(0.18 0.02 255);">First answer from your website</div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <div style="font-weight: 500; color: oklch(0.55 0.02 255);">Date</div>
        <div style="font-weight: 700; color: oklch(0.18 0.02 255);">{{granted_at}}</div>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <div style="font-weight: 500; color: oklch(0.55 0.02 255);">Reference</div>
        <div style="font-weight: 700; color: oklch(0.18 0.02 255); font-variant-numeric: tabular-nums;">{{ledger_ref}}</div>
      </div>
      <div style="height: 1px; background: oklch(0.92 0.01 255); margin: 4px 0;"></div>
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div style="font-size: 12px; font-weight: 500; color: oklch(0.55 0.02 255);">Valid 12 months · Failed messages never charged</div>
        <svg width="26" height="26" viewBox="0 0 76 76" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M14 62 L38 12 L62 62 H51 L38 32 L25 62 Z" fill="oklch(0.18 0.02 255)"></path><rect x="30" y="49" width="16" height="7" rx="3.5" fill="oklch(0.18 0.02 255)"></rect></svg>
      </div>
    </div>
  </div>
  <div style="position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 500; color: oklch(0.7 0.02 255);">First day's work, on the house</div>
</div>
</div>
</body></html>
