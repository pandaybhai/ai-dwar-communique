<!doctype html><html><head><meta charset="utf-8"><title>brief</title></head>
<body style="margin:0;width:1080px;height:1350px;overflow:hidden;background:oklch(0.18 0.02 255)">
<!-- Render at 1080x1350. Fonts: Plus Jakarta Sans 400-800, Caveat 600 (load TTFs into the renderer). Placeholders in {{ }} are filled server-side. -->
<div style="transform:scale(2);transform-origin:top left;width:540px;height:675px;">

  
  <style>
    body { margin: 0; font-family: "Plus Jakarta Sans", "Segoe UI", system-ui, sans-serif; }
    a { color: #31b57f; } a:hover { color: #6dd2a8; }
  </style>

<div style="width: 540px; height: 675px; background: oklch(0.18 0.02 255); position: relative; overflow: hidden; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 48px;">
  <div style="position: absolute; top: 40px; left: 48px; right: 48px; display: flex; justify-content: space-between; align-items: center;">
    <div style="font-size: 13px; font-weight: 800; color: oklch(0.985 0.003 250);">AiDwar</div>
    <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #31b57f;">First brief</div>
  </div>
  <div style="position: relative; width: 420px; background: oklch(0.985 0.003 250); border-radius: 18px; box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); display: flex; flex-direction: column; padding: 30px 32px 28px; box-sizing: border-box; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; color: oklch(0.55 0.02 255);">What I learned about</div>
      <div style="font-size: 28px; font-weight: 800; letter-spacing: -0.02em; color: oklch(0.18 0.02 255); line-height: 1.1;">{{business_name}}</div>
      <div style="font-size: 12px; font-weight: 500; color: oklch(0.55 0.02 255);">From {{pages_read}} pages of {{site_host}} · {{now_time}} today</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 14px;">
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <div style="width: 28px; height: 28px; border-radius: 14px; background: oklch(0.955 0.03 162); color: #1f8a5e; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">1</div>
        <div style="font-size: 16px; font-weight: 600; color: oklch(0.22 0.03 255); line-height: 1.4;">{{fact_1}}</div>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <div style="width: 28px; height: 28px; border-radius: 14px; background: oklch(0.955 0.03 162); color: #1f8a5e; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">2</div>
        <div style="font-size: 16px; font-weight: 600; color: oklch(0.22 0.03 255); line-height: 1.4;">{{fact_2}}</div>
      </div>
      <div style="display: flex; gap: 14px; align-items: flex-start;">
        <div style="width: 28px; height: 28px; border-radius: 14px; background: oklch(0.955 0.03 162); color: #1f8a5e; font-size: 13px; font-weight: 800; display: flex; align-items: center; justify-content: center; flex-shrink: 0;">3</div>
        <div style="font-size: 16px; font-weight: 600; color: oklch(0.22 0.03 255); line-height: 1.4;">{{fact_3}}</div>
      </div>
    </div>
    <div style="height: 1px; background: oklch(0.92 0.01 255);"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <div style="font-family: Caveat, cursive; font-size: 24px; font-weight: 600; color: oklch(0.22 0.03 255);">Did I get that right?</div>
      <div style="font-size: 11px; font-weight: 600; color: oklch(0.55 0.02 255);">— Aiden</div>
    </div>
  </div>
  <div style="position: absolute; bottom: 34px; left: 0; right: 0; text-align: center; font-size: 13px; font-weight: 500; color: oklch(0.7 0.02 255);">Three things a customer might ask you today</div>
</div>
</div>
</body></html>
